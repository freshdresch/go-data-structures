version: "2"

linters:
  enable:
    - lll
    - revive
  settings:
    lll:
      line-length: 100
      tab-width: 1

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/freshdresch/go-data-structures
